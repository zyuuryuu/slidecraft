name: SBOM

# Generate a CycloneDX Software Bill of Materials for both the JS app and the
# Rust/Tauri backend, uploaded as build artifacts (90-day retention). Run locally
# for just the JS side with `npm run sbom`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom-npm.cdx.json

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-cyclonedx
      - name: cargo SBOM (CycloneDX)
        working-directory: src-tauri
        run: cargo cyclonedx --format json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            sbom-npm.cdx.json
            src-tauri/*.cdx.json
          retention-days: 90
